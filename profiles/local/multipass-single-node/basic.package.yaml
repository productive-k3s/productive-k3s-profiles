inputs:
  - name: TF_VAR_cluster_name
    required: true
    sensitive: false
    source: package-default
    description: Multipass cluster name
  - name: TF_VAR_image
    required: true
    sensitive: false
    source: package-default
    description: Multipass image identifier
  - name: TF_VAR_base_domain
    required: true
    sensitive: false
    source: package-default
    description: Base domain used for generated hostnames
  - name: TF_VAR_agent_count
    required: true
    sensitive: false
    source: package-default
    description: Number of Multipass agent nodes; 0 for single-node validation
