compatibility:
  requires:
    infra:
      contract: profile/v1
      minEngineVersion: 0.9.65
      maxEngineVersionExclusive: 0.10.0
    core:
      minVersion: 0.9.6
      maxVersionExclusive: 0.10.0
  testedWith:
    infra:
      - release: 0.9.65-0.9.6
        core: 0.9.6
runtime:
  executionScope: local-host
  requiredCapabilities:
    - local-virtualization
  requiredCommands:
    - curl
    - jq
    - multipass
    - sha256sum
    - ssh
    - ssh-keygen
    - tar
    - timeout
    - tofu
inputs:
  - name: TF_VAR_cluster_name
    required: true
    sensitive: false
    source: package-default
    description: Multipass cluster name
  - name: TF_VAR_image
    required: true
    sensitive: false
    source: package-default
    description: Multipass image identifier
  - name: TF_VAR_base_domain
    required: true
    sensitive: false
    source: package-default
    description: Base domain used for generated hostnames
  - name: TF_VAR_agent_count
    required: true
    sensitive: false
    source: package-default
    description: Number of Multipass agent nodes; 0 for single-node validation
