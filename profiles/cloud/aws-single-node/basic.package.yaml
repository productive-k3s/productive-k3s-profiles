compatibility:
  requires:
    infra:
      contract: profile/v1
      minEngineVersion: 0.9.65
      maxEngineVersionExclusive: 0.10.0
    core:
      minVersion: 0.9.6
      maxVersionExclusive: 0.10.0
  testedWith:
    infra:
      - release: 0.9.65-0.9.6
        core: 0.9.6
inputs:
  - name: AWS_REGION
    required: true
    sensitive: false
    source: package-default
    description: Default AWS region used for provisioning
  - name: AWS_KEY_PAIR_NAME
    required: true
    sensitive: false
    source: local-override
    description: Existing AWS EC2 key pair name
  - name: AWS_SSH_KEY_PATH
    required: true
    sensitive: false
    source: local-override
    description: Absolute local path to the matching private key
