inputs:
  - name: OCI_COMPARTMENT_OCID
    required: true
    sensitive: false
    source: local-override
    description: OCI compartment OCID where the single ARM node is created
  - name: OCI_REGION
    required: true
    sensitive: false
    source: package-default
    description: OCI region used for provisioning
  - name: OCI_AVAILABILITY_DOMAIN
    required: false
    sensitive: false
    source: local-override
    description: Optional OCI availability domain; empty selects the first returned domain
  - name: OCI_CLUSTER_NAME
    required: true
    sensitive: false
    source: package-default
    description: Name used for generated resources and Productive K3S metadata
  - name: OCI_SHAPE
    required: true
    sensitive: false
    source: package-default
    description: OCI compute shape for the ARM node
  - name: OCI_OCPUS
    required: true
    sensitive: false
    source: package-default
    description: OCPU count for the flexible Ampere shape
  - name: OCI_MEMORY_IN_GBS
    required: true
    sensitive: false
    source: package-default
    description: Memory in GiB for the flexible Ampere shape
  - name: OCI_BOOT_VOLUME_SIZE_GB
    required: true
    sensitive: false
    source: package-default
    description: Boot volume size in GiB
  - name: OCI_IMAGE_OCID
    required: true
    sensitive: false
    source: local-override
    description: Ubuntu ARM64 image OCID compatible with the selected region
  - name: OCI_SSH_PUBLIC_KEY_PATH
    required: true
    sensitive: false
    source: local-override
    description: Absolute local path to the SSH public key added to the VM
  - name: OCI_SSH_PRIVATE_KEY_PATH
    required: true
    sensitive: false
    source: local-override
    description: Absolute local path to the matching private key
  - name: OCI_SSH_ALLOWED_CIDR
    required: true
    sensitive: false
    source: package-default
    description: CIDR allowed to reach SSH on TCP/22
  - name: OCI_HTTP_ALLOWED_CIDR
    required: true
    sensitive: false
    source: package-default
    description: CIDR allowed to reach HTTP and HTTPS on TCP/80 and TCP/443
  - name: OCI_API_ALLOWED_CIDR
    required: true
    sensitive: false
    source: package-default
    description: CIDR allowed to reach the Kubernetes API on TCP/6443
  - name: OCI_BASE_DOMAIN
    required: true
    sensitive: false
    source: package-default
    description: Base domain used to derive service hostnames when explicit hosts are not set
  - name: OCI_RANCHER_HOST
    required: true
    sensitive: false
    source: package-default
    description: Hostname used for Rancher access
  - name: OCI_REGISTRY_HOST
    required: true
    sensitive: false
    source: package-default
    description: Hostname used for the in-cluster registry
