apiVersion: materials.productive-k3s.io/v1alpha1
kind: MaterialsLock
metadata: {owner: productive-k3s-profiles, package: aws-single-node}
spec:
  materials:
    - {id: opentofu, type: binary, name: opentofu, version: 1.12.6, source: "https://github.com/opentofu/opentofu", pinPolicy: exact, required: true}
    - {id: aws-provider, type: opentofu-provider, name: hashicorp/aws, version: 6.42.0, source: "registry.opentofu.org/hashicorp/aws", pinPolicy: exact-lock, required: true}
    - {id: ubuntu-ami, type: os-image, name: ubuntu-noble, version: "24.04", source: aws, pinPolicy: dynamic-resolved, required: true}
