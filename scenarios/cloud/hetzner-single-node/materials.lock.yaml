apiVersion: materials.productive-k3s.io/v1alpha1
kind: MaterialsLock
metadata: {owner: productive-k3s-profiles, package: hetzner-single-node}
spec:
  materials:
    - {id: opentofu, type: binary, name: opentofu, version: 1.12.6, source: "https://github.com/opentofu/opentofu", pinPolicy: exact, required: true}
    - {id: hcloud-provider, type: opentofu-provider, name: hetznercloud/hcloud, version: 1.68.0, source: "registry.opentofu.org/hetznercloud/hcloud", pinPolicy: exact-lock, required: true}
    - {id: ubuntu-image, type: os-image, name: ubuntu-24.04, version: "24.04", source: hcloud, pinPolicy: dynamic-resolved, required: true}
