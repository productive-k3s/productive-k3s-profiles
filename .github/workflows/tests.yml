name: Profile Tests

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0

      - name: Run static + contract matrix
        run: make test-matrix INFRA_VERSION=development
